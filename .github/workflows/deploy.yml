name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Configura los permisos del token de GitHub para poder escribir en Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evita que se acumulen despliegues viejos si haces pushes seguidos
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefactos de la web
        uses: actions/upload-pages-artifact@v3
        with:
          # Sube la raíz del repositorio (donde está index.html)
          path: '.'

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
